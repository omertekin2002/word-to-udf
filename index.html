<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description"
    content="Convert Word documents (.docx) to UYAP UDF format online. Free, fast, and secure - your files never leave your browser.">
  <title>Word to UDF Converter | UYAP Document Converter</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Space+Mono:wght@400;700&display=swap"
    rel="stylesheet">
</head>

<body>
  <div class="noise-overlay" aria-hidden="true"></div>

  <div class="site-frame">
    <nav class="nav-bar">
      <div class="nav-brand"><span class="brand-owner">omertekin2002</span>/<span class="brand-project">WORD-TO-UDF</span> <span class="blink">_</span></div>
      <div class="nav-links">
        <a href="https://github.com/omertekin2002/word-to-udf" target="_blank" rel="noopener noreferrer">[ SRC ]</a>
        <button id="themeToggle" class="theme-toggle-btn" aria-label="Toggle theme"><span class="icon">☀️</span></button>
      </div>
    </nav>

    <main class="content-grid">
      <section class="grid-cell full-width hero-cell">
        <div class="hero-content">
          <h1>Word to <span>UDF</span></h1>
          <p class="hero-desc">Convert your .docx documents to UYAP UDF format directly in your browser.</p>

          <div class="upload-card" id="uploadCard">
            <div class="upload-zone" id="uploadZone">
              <input type="file" id="fileInput" accept=".docx" class="file-input" aria-label="Upload Word document">
              <div class="upload-content">
                <div class="upload-icon">
                  <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path
                      d="M21 15V19C21 19.5304 20.7893 20.0391 20.4142 20.4142C20.0391 20.7893 19.5304 21 19 21H5C4.46957 21 3.96086 20.7893 3.58579 20.4142C3.21071 20.0391 3 19.5304 3 19V15"
                      stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
                    <polyline points="17,8 12,3 7,8" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                      stroke-linejoin="round" />
                    <line x1="12" y1="3" x2="12" y2="15" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                      stroke-linejoin="round" />
                  </svg>
                </div>
                <p class="upload-text">Drag and drop your <strong>.docx</strong> file here</p>
                <p class="upload-subtext">or click to browse</p>
              </div>
            </div>

            <div class="file-info hidden" id="fileInfo">
              <div class="file-icon">
                <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                  <path
                    d="M14 2H6C5.46957 2 4.96086 2.21071 4.58579 2.58579C4.21071 2.96086 4 3.46957 4 4V20C4 20.5304 4.21071 21.0391 4.58579 21.4142C4.96086 21.7893 5.46957 22 6 22H18C18.5304 22 19.0391 21.7893 19.4142 21.4142C19.7893 21.0391 20 20.5304 20 20V8L14 2Z"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
                  <polyline points="14,2 14,8 20,8" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                    stroke-linejoin="round" />
                </svg>
              </div>
              <div class="file-details">
                <p class="file-name" id="fileName">document.docx</p>
                <p class="file-size" id="fileSize">0 KB</p>
              </div>
              <button class="remove-file" id="removeFile" aria-label="Remove file">
                <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                  <line x1="18" y1="6" x2="6" y2="18" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                    stroke-linejoin="round" />
                  <line x1="6" y1="6" x2="18" y2="18" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                    stroke-linejoin="round" />
                </svg>
              </button>
            </div>

            <div class="progress-container hidden" id="progressContainer">
              <div class="progress-bar">
                <div class="progress-fill" id="progressFill"></div>
              </div>
              <p class="progress-text" id="progressText">Converting...</p>
            </div>

            <button class="convert-btn" id="convertBtn" disabled>
              <span class="btn-text">Convert to UDF</span>
              <span class="btn-icon">
                <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                  <path d="M5 12H19" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                    stroke-linejoin="round" />
                  <path d="M12 5L19 12L12 19" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                    stroke-linejoin="round" />
                </svg>
              </span>
            </button>

            <div class="download-section hidden" id="downloadSection">
              <div class="success-icon">
                <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                  <path
                    d="M22 11.08V12C21.9988 14.1564 21.3005 16.2547 20.0093 17.9818C18.7182 19.709 16.9033 20.9725 14.8354 21.5839C12.7674 22.1953 10.5573 22.1219 8.53447 21.3746C6.51168 20.6273 4.78465 19.2461 3.61096 17.4371C2.43727 15.628 1.87979 13.4881 2.02168 11.3363C2.16356 9.18455 2.99721 7.13631 4.39828 5.49706C5.79935 3.85781 7.69279 2.71537 9.79619 2.24013C11.8996 1.7649 14.1003 1.98232 16.07 2.85999"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
                  <polyline points="22,4 12,14.01 9,11.01" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                    stroke-linejoin="round" />
                </svg>
              </div>
              <p class="success-text">Conversion complete</p>
              <button class="download-btn" id="downloadBtn">
                <span class="btn-text">Download UDF File</span>
                <span class="btn-icon">
                  <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path
                      d="M21 15V19C21 19.5304 20.7893 20.0391 20.4142 20.4142C20.0391 20.7893 19.5304 21 19 21H5C4.46957 21 3.96086 20.7893 3.58579 20.4142C3.21071 20.0391 3 19.5304 3 19V15"
                      stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
                    <polyline points="7,10 12,15 17,10" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                      stroke-linejoin="round" />
                    <line x1="12" y1="15" x2="12" y2="3" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                      stroke-linejoin="round" />
                  </svg>
                </span>
              </button>
              <button class="convert-another" id="convertAnother">Convert another file</button>
            </div>

            <div class="error-message hidden" id="errorMessage">
              <div class="error-icon">
                <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                  <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                    stroke-linejoin="round" />
                  <line x1="15" y1="9" x2="9" y2="15" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                    stroke-linejoin="round" />
                  <line x1="9" y1="9" x2="15" y2="15" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                    stroke-linejoin="round" />
                </svg>
              </div>
              <p class="error-text" id="errorText">An error occurred</p>
            </div>
          </div>
        </div>
      </section>

      <footer class="grid-cell full-width footer-cell">
        <div class="social-links">
          <a href="https://www.linkedin.com/in/ömer-tekin" target="_blank" rel="noopener noreferrer">[ LINKEDIN ]</a>
          <a href="https://github.com/omertekin2002" target="_blank" rel="noopener noreferrer">[ GITHUB ]</a>
        </div>
      </footer>
    </main>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/docx-parser.js"></script>
  <script src="js/udf-generator.js"></script>
  <script src="js/app.js"></script>
</body>

</html>
